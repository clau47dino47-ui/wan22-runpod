name: Build Vast.ai image

on:
  push:
    branches: [main]
    paths:
      - 'server.py'
      - 'Dockerfile.vastai'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push vastai image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.vastai
          push: true
          tags: ghcr.io/${{ github.repository }}:vastai
